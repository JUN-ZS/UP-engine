name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: node --check tools/read-studio/app.js
      - run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for root in ('schemas','configs','examples') for p in pathlib.Path(root).rglob('*.json')]; print('JSON files valid')"
      - run: ige validate-manifest examples/peep_manifest.json
      - run: ige read-image --help
      - run: ige compile-generation --help
      - run: ige generate-candidate --help
      - run: ige accept-candidate --help
      - run: ige assess-registration --help
      - run: ige composite-generation --help
      - run: ige diagnose-image --help
      - run: ige ref-search --skill DETAIL6
      - run: ige skill-plan --help
      - run: ige upscale-siax --help
      - run: ige siax-distribute-plan --help
      - run: ige siax-distribute-worker --help
      - run: ige siax-distribute-stitch --help
      - run: ige detail6 --help
      - run: python -c "import json,pathlib; json.loads(pathlib.Path('src/ige/data/legacy_reference_catalog.json').read_text(encoding='utf-8')); print('reference catalog valid')"
      - name: Mark live xAI API E2E status
        run: |
          if [ -z "${XAI_API_KEY:-}" ]; then
            echo "xAI API E2E: NOT RUN (no XAI_API_KEY in CI secrets)"
          else
            echo "xAI API E2E: key present but live E2E is opt-in and not asserted green without gold annotations"
          fi
